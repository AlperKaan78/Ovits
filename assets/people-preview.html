<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mor Sarmaşık — Halk</title>
<style>body{margin:0;background:#151b22;color:#f4ead9;font:14px system-ui}h1,p{margin:16px 24px}canvas{display:block;width:100%;height:560px}.labels{display:grid;grid-template-columns:repeat(6,1fr);text-align:center}.labels img{height:140px;border:1px solid #87714e}.labels span{display:block;padding:8px}a{color:#c8b0e9}</style>
<h1>Mor Sarmaşık · Halkımız</h1><p>Altın kabuk, altı kol ve mesleğe özgü ekipman · Özgün prosedürel 3B modeller ve sağladığınız karakter görselleri. <a href="game3d.html">Oyunu aç</a></p><canvas></canvas><div class="labels"></div>
<script type="module">
import {THREE,createView,createModel,batchStatic} from './art3d.js';
const v=createView(document.querySelector('canvas')),items=[['isci','female','Kadın işçi'],['isci','male','Erkek işçi'],['bilimci','female','Kadın bilim insanı'],['bilimci','male','Erkek bilim insanı'],['asker','female','Kadın asker'],['asker','male','Erkek asker']];
for(const [i,[kind,gender,label]]of items.entries()){const m=batchStatic(createModel(kind,gender));m.position.set((i-2.5)*1.35,0,0);m.rotation.y=-.15;v.scene.add(m);const el=document.createElement('div'),img=document.createElement('img'),name=document.createElement('span');img.src='./people/'+kind+'-'+gender+'.png';img.alt=label+' referansı';name.textContent=label;el.append(img,name);document.querySelector('.labels').append(el);}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:'#73716b',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;v.scene.add(floor);v.camera.position.set(0,2.5,9.5);v.camera.lookAt(0,1,0);v.renderer.render(v.scene,v.camera);window.peopleView=v;window.addEventListener('resize',()=>{v.resize();v.renderer.render(v.scene,v.camera);});
</script></html>
